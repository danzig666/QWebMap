# Keeps the variant branches up to date with the generic branch: after every
# push to main, main is merged into each variant branch (see
# docs/BRANCHES.md). Variant branches only add files, so the merge is
# normally automatic. On a conflict nothing is pushed and an issue is opened
# for a person to resolve it.
name: Sync variant branches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    # One sync of a branch at a time: two overlapping runs (two quick pushes
    # to main) would both start from the same commit, and the second push
    # would be refused.
    concurrency:
      group: sync-${{ matrix.branch }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        branch: [hu-hesz]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Without releases/ (the zips are most of the checkout): the merge
          # works on the trees, a sparse checkout only skips writing them.
          # blob:none alone still downloads every file at HEAD.
          filter: blob:none
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - name: Merge main into ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ matrix.branch }}
        run: |
          if ! git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null; then
            echo "No branch ${BRANCH}; nothing to sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          problem=""
          for attempt in 1 2; do
            # The latest main and branch on the second attempt (another push
            # may have moved either since this run started).
            git fetch --quiet origin main "${BRANCH}"
            git checkout -B "${BRANCH}" "origin/${BRANCH}"
            if ! git merge --no-edit origin/main; then
              git merge --abort
              problem="the merge has conflicts"
              break
            fi
            if git push origin "${BRANCH}"; then
              problem=""
              break
            fi
            # The Actions token may not push changes of .github/workflows files.
            if [ -n "$(git diff --name-only "origin/${BRANCH}" HEAD -- .github/workflows)" ]; then
              problem="the push was refused (main changed a workflow file; the Actions token cannot push those)"
              break
            fi
            problem="the push was refused twice (${BRANCH} or main moved during the sync)"
          done
          if [ -n "${problem}" ]; then
            gh issue create --title "Sync: merging main into ${BRANCH} needs a person" \
              --body "Merging main (${GITHUB_SHA}) into ${BRANCH} did not complete: ${problem}. Merge it by hand: git checkout ${BRANCH} && git merge main && git push. Keep variant changes in new files (docs/BRANCHES.md)."
            exit 1
          fi
