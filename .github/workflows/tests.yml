# Runs the full test suite in the official QGIS image of the oldest QGIS the
# plugin installs on (metadata.txt qgisMinimumVersion: 3.44 LTR, Qt5, Ubuntu
# 24.04; development runs 3.34 locally, which users cannot install on):
# unit + PyQGIS integration tests in one job, browser tests (QGIS export +
# Chromium) in another; and the same under Qt6 in the QGIS 4 image (qt6.yml,
# called as the "qt6" job). The unit job also gets Node with MapLibre
# (tools/maplibre), a moto S3 server and the go-pmtiles CLI
# (tools/ci/prepare_test_tools.sh): the parity tests and the real S3 SDK test
# need them, and with Q2VT_REQUIRE_TOOLS they fail instead of skipping.
#
# Nightly at 1:23 Budapest time on main, which also starts the run of each
# variant branch (hu-hesz). A nightly run stops within seconds when no commit
# since the branch's last successful run changed code or tests (the paths in
# tools/ci/tested_paths); docs, README, changelog, release notes and zips do
# not count. On a variant branch main's changes merged in count too: the
# variant's preset and viewer add-on run on main's hooks.
#
# GitHub delays or drops scheduled runs under load (most of all at the top of
# the hour, and in the European morning: the 3:00 slot started as late as
# 7:39), so the slots are at odd minutes in the quiet night hours (around
# midnight UTC), and a second entry at 2:47 Budapest time runs only when the 1:23 one
# did not start that night (else it cancels itself: a cancelled run does not
# count as tested).
#
# "Run workflow" in the Actions tab always runs everything, on the branch
# chosen there (tick "nightly" to get the nightly check instead).
name: Tests

on:
  schedule:
    - cron: "23 1 * * *"
      timezone: Europe/Budapest
    - cron: "47 2 * * *"  # backup, see above
      timezone: Europe/Budapest
  workflow_dispatch:
    inputs:
      nightly:
        description: "Nightly mode: skip if no code or tests changed since the last successful run"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write  # the nightly run on main starts the variant branches' runs

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # The history (commits and trees: enough for git diff --name-only)
          # and only tools/ci and the root files: blob:none alone still
          # downloads every file at HEAD, the release zips included.
          filter: blob:none
          sparse-checkout: tools/ci
      - name: Skip the backup slot if tonight's run already started
        id: backup
        # The backup entry of on.schedule (tests/unit/test_ci_workflows.py).
        if: github.event_name == 'schedule' && github.event.schedule == '47 2 * * *'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since="$(date -u -d '-3 hours' +%Y-%m-%dT%H:%M:%SZ)"
          others="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?event=schedule&created=%3E%3D${since}&per_page=10" \
                    --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID})] | length")"
          if [ "${others}" != "0" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "The 1:23 run started tonight: backup slot skipped." | tee -a "${GITHUB_STEP_SUMMARY}"
            # Cancelled, not successful: a skipped success would count as
            # tested (the next nightly and the release start from it) while
            # the 1:23 run may still fail.
            gh run cancel "${GITHUB_RUN_ID}"
            sleep 120
          fi
      - name: Start the nightly runs of the variant branches
        if: github.event_name == 'schedule' && steps.backup.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for branch in hu-hesz; do
            if git ls-remote --exit-code --heads origin "${branch}" >/dev/null; then
              gh workflow run tests.yml --ref "${branch}" -f nightly=true
              echo "Started the nightly run of ${branch}."
            fi
          done
      - name: Decide whether to run the tests
        id: decide
        env:
          SKIP: ${{ steps.backup.outputs.skip == 'true' }}
          GH_TOKEN: ${{ github.token }}
          NIGHTLY: ${{ github.event_name == 'schedule' || inputs.nightly == true }}
          BRANCH: ${{ github.ref_name }}
        run: |
          run() { echo "run=$1" >> "${GITHUB_OUTPUT}"; echo "$2"; echo "$2" >> "${GITHUB_STEP_SUMMARY}"; exit 0; }
          [ "${SKIP}" != "true" ] || run false "Tonight's run already started: skipped."
          [ "${NIGHTLY}" = "true" ] || run true "Manual run: all tests."
          last="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs?branch=${BRANCH}&status=success&per_page=1" \
                  --jq '.workflow_runs[0].head_sha // ""')"
          [ -n "${last}" ] || run true "No earlier successful run on ${BRANCH}: all tests."
          git cat-file -e "${last}^{commit}" 2>/dev/null \
            || run true "The last tested commit ${last} is gone (history rewritten): all tests."
          mapfile -t paths < <(grep -v '^#' tools/ci/tested_paths)
          # On a variant branch main's merged changes count as well (and
          # variant.json): the variant runs on main's hooks.
          changed="$(git diff --name-only "${last}" HEAD -- "${paths[@]}" variant.json)"
          [ -n "${changed}" ] || run false "Nothing to test on ${BRANCH} since ${last:0:7}: skipped."
          run true "Changed since ${last:0:7}: $(echo "${changed}" | wc -l) files, e.g. $(echo "${changed}" | head -5 | paste -sd ' ')"

  qgis-tests:
    name: Unit + QGIS integration tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    container:
      # The minimum QGIS (metadata.txt), pinned like the Qt6 image.
      image: qgis/qgis:3.44.15-noble@sha256:907fb2cc44adc47a8eba64316c345f0675c226d11cddea47b16ef03097caea7e
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      Q2VT_REQUIRE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - name: Prepare
        run: tools/ci/prepare_qgis_container.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Tools of the parity tests
        run: tools/ci/prepare_test_tools.sh
      - name: Unit tests
        if: success() || failure()
        run: tools/ci/run_test_files.sh "Unit tests" $(ls tests/unit/test_*.py | sort)
      - name: QGIS integration tests
        if: success() || failure()
        run: tools/ci/run_test_files.sh "QGIS integration tests" $(ls tests/integration/test_*.py | sort)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports-qgis-${{ github.ref_name }}
          path: test-reports/
          if-no-files-found: ignore

  browser-tests:
    name: Browser tests
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      # The minimum QGIS (metadata.txt), pinned like the Qt6 image.
      image: qgis/qgis:3.44.15-noble@sha256:907fb2cc44adc47a8eba64316c345f0675c226d11cddea47b16ef03097caea7e
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            /*
            !/releases/
          sparse-checkout-cone-mode: false
      - name: Prepare
        run: tools/ci/prepare_qgis_container.sh
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Node packages and Chromium
        working-directory: tests/browser
        run: |
          npm ci --no-audit --no-fund
          npx playwright-core install --with-deps chromium
          chromium="$(node --input-type=module -e "import { chromium } from 'playwright-core'; console.log(chromium.executablePath())")"
          test -x "${chromium}"
          echo "Q2VT_CHROMIUM=${chromium}" >> "${GITHUB_ENV}"
      - name: MapLibre bundle is built from tools/maplibre
        working-directory: tools/maplibre
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          python3 build.py --check
      - name: Browser tests
        run: tools/ci/run_test_files.sh "Browser tests" $(ls tests/browser/test_*.py | sort)
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: reports-browser-${{ github.ref_name }}
          path: |
            test-reports/
            tests/browser/artifacts/
          if-no-files-found: ignore

  qt6:
    name: Qt6 (QGIS 4)
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/qt6.yml
